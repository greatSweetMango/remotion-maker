name: Sync agent-company plugin to marketplace

# main 에 plugin/agent-company/** 변경이 머지되면
# personal-calude-marketplace 레포에 sync 브랜치를 push 하고 PR 을 자동 생성한다.
# 회고에서 도출된 개선이 자동으로 마켓플레이스에 흘러가도록 하는 파이프라인.

on:
  push:
    branches: [main]
    paths:
      - 'plugin/agent-company/**'
      - '.github/workflows/sync-agent-company-plugin.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no diff (debug)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (remotion-maker)
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1

      - name: Checkout marketplace repo
        uses: actions/checkout@v4
        with:
          repository: greatSweetMango/personal-calude-marketplace
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          path: marketplace
          fetch-depth: 1

      - name: Compute version + sha
        id: meta
        run: |
          cd source
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION=$(jq -r '.version' plugin/agent-company/.claude-plugin/plugin.json)
          BRANCH="sync/agent-company-${SHORT_SHA}"
          echo "sha=$SHORT_SHA"      >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"      >> "$GITHUB_OUTPUT"

      - name: Sync files into marketplace working tree
        run: |
          set -euxo pipefail

          # 마켓플레이스 루트 = source의 plugin/ 내용물.
          # agent-company/ 디렉토리 통째로 교체 + 마켓플레이스 매니페스트 갱신.
          rm -rf marketplace/agent-company
          cp -R source/plugin/agent-company marketplace/agent-company

          # marketplace.json 은 source 의 것이 단일 원천 (편집 시 source 에서)
          mkdir -p marketplace/.claude-plugin
          cp source/plugin/.claude-plugin/marketplace.json marketplace/.claude-plugin/marketplace.json

          # 최상위 README 도 source 가 원천
          cp source/plugin/README.md marketplace/README.md

      - name: Detect diff
        id: diff
        run: |
          cd marketplace
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true"  >> "$GITHUB_OUTPUT"
            git diff --stat | tail -20
          fi

      - name: Open PR on marketplace repo
        if: steps.diff.outputs.has_changes == 'true' || inputs.force == true
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHORT_SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euxo pipefail
          cd marketplace

          git config user.name  "agent-company-sync[bot]"
          git config user.email "agent-company-sync@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          git commit -m "sync(agent-company): update from remotion-maker@${SHORT_SHA}

          source repo: greatSweetMango/remotion-maker
          source commit: ${SHORT_SHA}
          plugin version: ${VERSION}"

          # remote 인증은 위 checkout 단계에서 토큰이 git config로 박혀있음.
          git push --force-with-lease origin "$BRANCH"

          # 같은 브랜치명에 열린 PR 있으면 재사용
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // ""')
          if [[ -z "$EXISTING" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "sync(agent-company): from remotion-maker@${SHORT_SHA}" \
              --body "## Auto-sync

          소스 레포 \`greatSweetMango/remotion-maker\` 의 \`plugin/agent-company/\` 변경을 마켓플레이스로 가져옵니다.

          - source commit: \`${SHORT_SHA}\`
          - plugin version: \`${VERSION}\`
          - workflow: \`.github/workflows/sync-agent-company-plugin.yml\`

          ## 검토 체크리스트

          - [ ] commands/ 변경 의도 확인
          - [ ] agents/ SOP 변경 확인
          - [ ] hooks/ 실행 권한 유지 (\`chmod +x\`)
          - [ ] templates/ 호환성
          - [ ] version bump (필요 시)

          ---
          🤖 Auto-generated by sync-agent-company-plugin workflow."
          else
            echo "Reusing existing PR #$EXISTING"
            gh pr comment "$EXISTING" --body "Re-synced from remotion-maker@${SHORT_SHA}"
          fi

      - name: No changes
        if: steps.diff.outputs.has_changes == 'false' && inputs.force != true
        run: echo "No changes to sync."
